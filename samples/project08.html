<style>
  body, html {
  margin: 0;
  padding: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background-color: #fff;
  color: #000;
  text-transform: uppercase;
}


/* Projects Grid */
.projects-grid {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* 4 equal columns */
  gap: 20px;
  padding: 40px;
  justify-items: center;
}

.project-card {
  position: relative;
  cursor: pointer;
  overflow: hidden;
  width: 100%;
  max-width: 350px; /* controls size */
  aspect-ratio: 1 / 1; /* 🔹 makes each card perfectly square */
  border-radius: 4px;
}

.project-card img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* fills square without distortion */
  transition: transform 0.4s ease;
}

.project-card:hover img {
  transform: scale(1.05);
}



/* Footer */
.footer {
  background-color: #fff;
  color: #000;
  text-align: center;
  padding: 40px 20px;
  border-top: 1px solid #ddd;
}
.footer h2 {
  font-size: 2.5em;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 20px;
  text-transform: uppercase;
  -webkit-text-stroke: 1px #000;
  color: transparent;
}
.back-container {
  width: 100%;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  padding: 5px 40px 0; /* aligns visually below header */
}


.back-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;              /* fixed width */
  height: 60px;             /* fixed height */
  border-radius: 0;         /* sharp square corners */
  border: 2px solid #000;
  font-size: 1.5em;
  font-weight: 700;
  color: #000;
  text-decoration: none;
  transition: all 0.3s ease;
}


.back-btn:hover {
  background-color: #000;
  color: #fff;
  transform: scale(1.05);
}

/* =========================================================
       RESPONSIVE MEDIA QUERIES (3-COLUMN GRID FOR ALL VIEWS)
       ========================================================= */

    /* Tablet View (Max Width: 992px) */
    @media (max-width: 992px) {
      

      .projects-grid {
        margin-top: 85px;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        padding: 25px;
      }

      .back-container {
        padding: 15px 25px 30px;
      }

      .back-btn {
        width: 50px;
        height: 50px;
        font-size: 1.3em;
      }
    }
    
    /* Small Tablet & Large Mobile (Max Width: 768px) */
@media (max-width: 768px) {
  .projects-grid {
    margin-top: 75px;
    grid-template-columns: 1fr; /* single column */
    gap: 15px;
    padding: 0;                /* remove side padding */
    margin-left: 0;            /* remove left margin */
    margin-right: 0;           /* remove right margin */
    width: 100%;               /* force full width */
    box-sizing: border-box;    /* include padding in width */
  }

  .project-card {
    width: 100%;               /* stretch across screen */
    max-width: 100%;           
    aspect-ratio: 16 / 9;      /* cleaner full-width ratio */
    border-radius: 0;
  }
}

/* Mobile View (Max Width: 480px) */
@media (max-width: 480px) {
  html, body {
    width: 100%;
    overflow-x: hidden; /* 🔹 prevents horizontal scroll */
  }

  .projects-grid {
    margin-top: 100px; /* 🔹 ensures first image clears header */
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 0;
    margin-left: 0;
    margin-right: 0;
    width: 100vw;
    box-sizing: border-box;
  }

  .project-card {
    width: 100vw;              /* 🔹 fill entire screen width */
    max-width: 100vw;
    aspect-ratio: 16 / 9;
    border-radius: 0;
  }

  .project-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;            /* 🔹 removes inline gaps */
  }
}
