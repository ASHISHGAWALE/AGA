/* Header */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  z-index: 1000;
  background-color: #fff;
  border-bottom: 1px solid #ddd;
}

.logo {
  font-weight: 900;
  font-size: 2.5em;
  color: #000;   /* force black */
  transition: none; /* remove any animation or color transition */
}
.menu-toggle {
  width: 40px; height: 30px;
  display: flex; flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}

.line { height: 3px; background-color: black; border-radius: 2px; transition: all 0.3s ease; }
.line1 { width: 60%; align-self: flex-start; }
.line2 { width: 100%; }
.line3 { width: 70%; align-self: flex-end; }
.menu-toggle.active .line1 { transform: rotate(45deg) translate(5px, 5px); width: 100%; }
.menu-toggle.active .line2 { opacity: 0; }
.menu-toggle.active .line3 { transform: rotate(-45deg) translate(6px, -6px); width: 100%; }

/* Fullscreen Menu */
.menu-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #fff;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.5s ease, visibility 0.5s ease;
  z-index: 999;
}
.menu-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

.main-menu { list-style: none; text-align: center; }
.main-menu li { margin: 15px 0; }
.main-menu a { text-decoration: none; font-size: 2em; font-weight: 700; color: #000; transition: color 0.3s ease; }
.main-menu a:hover { color: #e67e22; }

.bottom-menu { position: absolute; bottom: 20px; display: flex; gap: 20px; font-size: 0.9em; font-weight: 600; }

/* Projects Grid */
.projects-grid {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* 4 equal columns */
  gap: 20px;
  padding: 40px;
  justify-items: center;
}

.project-card {
  position: relative;
  cursor: pointer;
  overflow: hidden;
  width: 100%;
  max-width: 350px; /* controls size */
  aspect-ratio: 1 / 1; /* 🔹 makes each card perfectly square */
  border-radius: 4px;
}

.project-card img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* fills square without distortion */
  transition: transform 0.4s ease;
}

.project-card:hover img {
  transform: scale(1.05);
}



/* Footer */
.footer {
  background-color: #fff;
  color: #000;

  padding: 40px 20px;
